    <main class="wrap">
      <div class="tabs" role="tablist" aria-label="清单类型">
        <button type="button" role="tab" id="tab-good" aria-selected="true" aria-controls="list" data-tab="good">推荐 <span class="n" id="n-good"></span></button>
        <button type="button" role="tab" id="tab-avoid" aria-selected="false" aria-controls="list" data-tab="avoid">避雷 <span class="n" id="n-avoid"></span></button>
      </div>

      <section class="panel" aria-label="筛选">
        <div class="row">
          <label class="field grow">
            <span>搜索</span>
            <span class="search">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m21 21-4.3-4.3"/><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z"/></svg>
              <input id="q" type="search" placeholder="店名、地址、推荐菜、备注" autocomplete="off" />
            </span>
          </label>
          <label class="field">
            <span>排序</span>
            <select id="sort">
              <option value="default">默认顺序</option>
              <option value="score">评分从高到低</option>
              <option value="priceAsc">人均从低到高</option>
              <option value="priceDesc">人均从高到低</option>
            </select>
          </label>
        </div>
        <fieldset class="chips" id="prices"><legend>人均(可多选)</legend></fieldset>
        <fieldset class="chips" id="districts"><legend>区域</legend></fieldset>
        <fieldset class="chips" id="categories"><legend>品类</legend></fieldset>
        <div class="row actions">
          <p id="count" class="count" role="status" aria-live="polite"></p>
          <button type="button" id="reset" class="btn ghost">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>重置筛选
          </button>
          <button type="button" id="random" class="btn primary">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg>随机一家
          </button>
        </div>
      </section>

      <section id="list" class="list" tabindex="-1" aria-label="结果列表"></section>
      <div class="more"><button type="button" id="more" class="btn" hidden>显示更多</button></div>
    </main>

    <footer class="wrap foot">
      <p>数据来自 sz-foods.xlsx,评分为各人主观打分,已统一折算为 100 分制;仅供参考。</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
